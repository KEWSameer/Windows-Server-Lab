<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Lab architecture: Windows 11 client connected to Windows Server 2022 domain controller" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="360" rx="16" fill="#0f172a"/>
  <text x="450" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">Windows Server 2022 Active Directory Home Lab</text>
  <text x="450" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">VMware Workstation  |  NAT network  |  Domain: lab.local</text>

  <rect x="50" y="110" width="270" height="190" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="185" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">Windows 11 Pro client</text>
  <text x="185" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Computer name: CL01</text>
  <text x="80" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- Joined to lab.local</text>
  <text x="80" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- Receives Group Policy</text>
  <text x="80" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- Maps the Devs share</text>
  <text x="80" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- Users: j.doe, s.davis</text>

  <line x1="320" y1="205" x2="580" y2="205" stroke="#a3e635" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="450" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a3e635">DNS  |  Kerberos  |  SMB</text>
  <text x="450" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a3e635">Group Policy refresh</text>

  <rect x="580" y="110" width="270" height="190" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="715" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f59e0b">Windows Server 2022</text>
  <text x="715" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Domain controller</text>
  <text x="610" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- Active Directory: lab.local</text>
  <text x="610" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- OU lab.users, group Dev</text>
  <text x="610" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- Group Policy Objects</text>
  <text x="610" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e2e8f0">- SMB share: Devs (NTFS)</text>
</svg>
